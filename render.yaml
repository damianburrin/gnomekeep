services:
  - type: web
    name: gnomekeep-online
    runtime: node
    plan: starter
    buildCommand: echo "No npm dependencies"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LEADERBOARD_ENDPOINT
        sync: false
      - key: SCORE_API_SECRET
        sync: false
